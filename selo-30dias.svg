<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sombra -->
  <circle cx="100" cy="105" r="85" fill="rgba(0,0,0,0.1)"/>
  
  <!-- Círculo externo verde escuro -->
  <circle cx="100" cy="100" r="85" fill="#0a4d2e"/>
  
  <!-- Círculo médio verde claro -->
  <circle cx="100" cy="100" r="75" fill="#25D366"/>
  
  <!-- Círculo interno branco -->
  <circle cx="100" cy="100" r="62" fill="white"/>
  
  <!-- Linha decorativa superior -->
  <path d="M 55,65 Q 100,55 145,65" stroke="#25D366" stroke-width="2" fill="none"/>
  
  <!-- Número 30 -->
  <text x="100" y="95" text-anchor="middle" font-size="48" font-weight="900" fill="#0a4d2e" font-family="Impact, Arial Black, sans-serif">30</text>
  
  <!-- Texto DIAS -->
  <text x="100" y="117" text-anchor="middle" font-size="16" font-weight="bold" fill="#0a4d2e" font-family="Arial, sans-serif">DIAS</text>
  
  <!-- Linha decorativa inferior -->
  <path d="M 55,135 Q 100,145 145,135" stroke="#25D366" stroke-width="2" fill="none"/>
  
  <!-- Texto GARANTIA -->
  <text x="100" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#666" font-family="Arial, sans-serif" letter-spacing="2">GARANTIA</text>
  
  <!-- Checkmark -->
  <circle cx="100" cy="170" r="8" fill="#25D366"/>
  <path d="M 96,170 L 99,173 L 104,167" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
